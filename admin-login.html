<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Pinaki Farms</title>
    <link rel="stylesheet" href="../css/admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Quick inline styles in case admin.css doesn't load */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f2f5;
        }
        .admin-login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a3a16, #2d5a27);
            padding: 20px;
        }
        .admin-login-box {
            background: #fff;
            padding: 40px;
            border-radius: 16px;
            width: 420px;
            max-width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .admin-login-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .admin-login-header i {
            font-size: 50px;
            color: #2d5a27;
        }
        .admin-login-header h2 {
            color: #333;
            font-size: 24px;
            margin-top: 10px;
        }
        .admin-login-header p {
            color: #666;
            font-size: 14px;
        }
        .login-error {
            background: #fee;
            color: #e74c3c;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            text-align: center;
            display: none;
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            color: #333;
            font-size: 14px;
        }
        .form-group label i {
            color: #2d5a27;
            width: 20px;
        }
        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 15px;
            transition: border-color 0.3s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #2d5a27;
        }
        .admin-login-btn {
            width: 100%;
            padding: 14px;
            background: #2d5a27;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        .admin-login-btn:hover {
            background: #1a3a16;
        }
        .admin-login-btn i {
            margin-right: 8px;
        }
        .back-link {
            text-align: center;
            margin-top: 15px;
        }
        .back-link a {
            color: #2d5a27;
            text-decoration: none;
            font-size: 14px;
        }
        .back-link a:hover {
            text-decoration: underline;
        }
        .back-link a i {
            margin-right: 5px;
        }
        /* Toast for messages */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #2d5a27;
            color: #fff;
            padding: 14px 30px;
            border-radius: 10px;
            z-index: 999999;
            opacity: 0;
            transition: opacity 0.3s;
            max-width: 90%;
            text-align: center;
            font-weight: 500;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .toast.show {
            opacity: 1;
        }
        .toast.error {
            background: #e74c3c;
        }
        .toast.success {
            background: #2d5a27;
        }
    </style>
</head>
<body>
    <div class="admin-login-container">
        <div class="admin-login-box">
            <div class="admin-login-header">
                <i class="fas fa-leaf"></i>
                <h2>Pinaki Farms</h2>
                <p>Admin Panel Login</p>
            </div>
            
            <div id="loginError" class="login-error"></div>
            
            <form id="adminLoginForm">
                <div class="form-group">
                    <label><i class="fas fa-envelope"></i> Email Address</label>
                    <input type="email" id="adminEmail" placeholder="admin@pinakifarms.com" required autocomplete="email" />
                </div>
                <div class="form-group">
                    <label><i class="fas fa-lock"></i> Password</label>
                    <input type="password" id="adminPassword" placeholder="Enter your password" required autocomplete="current-password" />
                </div>
                <button type="submit" class="admin-login-btn">
                    <i class="fas fa-sign-in-alt"></i> Login
                </button>
                <p class="back-link">
                    <a href="../index.html"><i class="fas fa-arrow-left"></i> Back to Website</a>
                </p>
            </form>
        </div>
    </div>

    <script type="module">
        // Import Firebase modules
        import { auth, signInWithEmailAndPassword, onAuthStateChanged } from '../firebase-config.js';

        console.log('✅ Admin Login page loaded');

        // DOM Elements
        const form = document.getElementById('adminLoginForm');
        const emailInput = document.getElementById('adminEmail');
        const passwordInput = document.getElementById('adminPassword');
        const errorDiv = document.getElementById('loginError');

        // ============= CHECK IF ALREADY LOGGED IN =============
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                console.log('User already logged in:', user.email);
                try {
                    // Check if user is admin
                    const { db, collection, query, where, getDocs } = await import('../firebase-config.js');
                    const q = query(collection(db, 'admins'), where('email', '==', user.email));
                    const querySnapshot = await getDocs(q);
                    
                    if (!querySnapshot.empty) {
                        console.log('✅ Admin verified, redirecting to dashboard...');
                        window.location.href = 'dashboard.html';
                    } else {
                        console.log('❌ User is not admin, logging out...');
                        await signOut(auth);
                    }
                } catch (error) {
                    console.error('Error checking admin:', error);
                }
            }
        });

        // ============= SHOW TOAST =============
        function showToast(message, type = 'success') {
            const existing = document.querySelector('.toast');
            if (existing) existing.remove();
            
            const toast = document.createElement('div');
            toast.className = 'toast ' + type;
            toast.textContent = message;
            document.body.appendChild(toast);
            
            setTimeout(() => toast.classList.add('show'), 10);
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }

        // ============= HANDLE LOGIN =============
        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = emailInput.value.trim();
            const password = passwordInput.value;
            
            // Hide previous error
            errorDiv.style.display = 'none';
            errorDiv.textContent = '';
            
            // Validate
            if (!email || !password) {
                errorDiv.textContent = '⚠️ Please fill all fields';
                errorDiv.style.display = 'block';
                return;
            }
            
            // Show loading state
            const submitBtn = form.querySelector('.admin-login-btn');
            const originalText = submitBtn.innerHTML;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Logging in...';
            submitBtn.disabled = true;
            
            try {
                console.log('🔑 Attempting login for:', email);
                
                // Sign in with Firebase Auth
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;
                console.log('✅ Login successful:', user.email);
                
                // Check if user is admin
                const { db, collection, query, where, getDocs } = await import('../firebase-config.js');
                const q = query(collection(db, 'admins'), where('email', '==', user.email));
                const querySnapshot = await getDocs(q);
                
                if (querySnapshot.empty) {
                    console.log('❌ User is not admin');
                    errorDiv.textContent = '❌ You are not authorized as admin. Please contact support.';
                    errorDiv.style.display = 'block';
                    await signOut(auth);
                    submitBtn.innerHTML = originalText;
                    submitBtn.disabled = false;
                    return;
                }
                
                // Get admin data
                let adminData = {};
                querySnapshot.forEach((doc) => {
                    adminData = { id: doc.id, ...doc.data() };
                });
                console.log('✅ Admin verified:', adminData);
                
                // Show success message
                showToast('✅ Welcome Admin! Redirecting...', 'success');
                
                // Redirect to dashboard
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 1000);
                
            } catch (error) {
                console.error('❌ Login error:', error);
                
                let errorMsg = '❌ Login failed. ';
                switch(error.code) {
                    case 'auth/user-not-found':
                        errorMsg += 'Admin account not found. Please check your email.';
                        break;
                    case 'auth/wrong-password':
                        errorMsg += 'Incorrect password. Please try again.';
                        break;
                    case 'auth/invalid-email':
                        errorMsg += 'Invalid email address format.';
                        break;
                    case 'auth/too-many-requests':
                        errorMsg += 'Too many failed attempts. Please try again later.';
                        break;
                    case 'auth/network-request-failed':
                        errorMsg += 'Network error. Please check your internet connection.';
                        break;
                    default:
                        errorMsg += error.message;
                }
                
                errorDiv.textContent = errorMsg;
                errorDiv.style.display = 'block';
                
                // Reset button
                submitBtn.innerHTML = originalText;
                submitBtn.disabled = false;
            }
        });

        // ============= KEYBOARD SHORTCUTS =============
        document.addEventListener('keydown', function(e) {
            // Press 'Esc' to clear error
            if (e.key === 'Escape') {
                errorDiv.style.display = 'none';
            }
        });

        console.log('✅ Admin Login ready!');
    </script>
</body>
</html>
