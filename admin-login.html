<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin sign in | Pinaki Farms</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;font:15px Arial;background:linear-gradient(135deg,#4b1d12,#8c2d19)}.card{width:min(100%,420px);padding:34px;border-radius:16px;background:#fff;box-shadow:0 20px 55px #0004}.brand{text-align:center;color:#8c2d19}.brand i{font-size:40px}.brand h1{margin:10px 0 5px}.brand p{color:#667085;margin:0 0 22px}label{display:block;margin:14px 0 6px;font-weight:bold;font-size:13px}input{width:100%;padding:12px;border:1px solid #d0d5dd;border-radius:8px;font:inherit}button{width:100%;margin-top:20px;padding:13px;border:0;border-radius:8px;background:#8c2d19;color:#fff;font-size:15px;font-weight:bold;cursor:pointer}button:disabled{opacity:.6}.message{display:none;padding:11px;border-radius:8px;margin-bottom:14px}.message.error{display:block;background:#fef3f2;color:#b42318}.message.success{display:block;background:#ecfdf3;color:#027a48}.back{text-align:center;margin:18px 0 0}.back a{color:#8c2d19;font-weight:bold;text-decoration:none}</style></head><body><main class="card"><div class="brand"><i class="fas fa-leaf"></i><h1>Pinaki Farms</h1><p>Authorised admin access</p></div><div class="message" id="message" role="alert"></div><form id="form"><label for="email">Email address</label><input id="email" type="email" autocomplete="email" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><button id="submit">Secure sign in</button></form><p class="back"><a href="index.html">← Back to store</a></p></main><script type="module">import{auth,db}from'./firebase-config.js';import{signInWithEmailAndPassword,onAuthStateChanged,signOut}from'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js';import{collection,query,where,getDocs}from'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';const m=document.getElementById('message'),form=document.getElementById('form'),btn=document.getElementById('submit');function msg(t,type='error'){m.textContent=t;m.className='message '+type}async function admin(u){const s=await getDocs(query(collection(db,'admins'),where('email','==',u.email)));return !s.empty}onAuthStateChanged(auth,async u=>{if(!u)return;if(await admin(u))location.replace('admin-panel.html');else{await signOut(auth);msg('This account does not have admin access.')}});form.addEventListener('submit',async e=>{e.preventDefault();btn.disabled=true;btn.textContent='Signing in…';try{const cred=await signInWithEmailAndPassword(auth,email.value.trim(),password.value);if(!await admin(cred.user)){await signOut(auth);throw new Error('not-admin')}msg('Access verified. Opening admin panel…','success');location.replace('admin-panel.html')}catch(err){msg(err.message==='not-admin'?'This account does not have admin access.':'Sign-in failed. Check your email and password.');btn.disabled=false;btn.textContent='Secure sign in'}});</script></body></html>
