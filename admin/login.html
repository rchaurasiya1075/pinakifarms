<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Pinaki Farms</title>
    <link rel="stylesheet" href="../css/admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="admin-login-container">
        <div class="admin-login-box">
            <div class="admin-login-header">
                <i class="fas fa-leaf"></i>
                <h2>Pinaki Farms</h2>
                <p>Admin Panel</p>
            </div>
            
            <div id="loginError" class="login-error" style="display:none;"></div>
            
            <form id="adminLoginForm">
                <div class="form-group">
                    <label><i class="fas fa-envelope"></i> Email Address</label>
                    <input type="email" id="adminEmail" placeholder="admin@pinakifarms.com" required />
                </div>
                <div class="form-group">
                    <label><i class="fas fa-lock"></i> Password</label>
                    <input type="password" id="adminPassword" placeholder="Enter your password" required />
                </div>
                <button type="submit" class="admin-login-btn">
                    <i class="fas fa-sign-in-alt"></i> Login
                </button>
                <p class="back-link">
                    <a href="../index.html"><i class="fas fa-arrow-left"></i> Back to Website</a>
                </p>
            </form>
        </div>
    </div>

    <script type="module">
        import { auth, signInWithEmailAndPassword, onAuthStateChanged } from '../firebase-config.js';

        // Check if already logged in
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                try {
                    const { db, collection, query, where, getDocs } = await import('../firebase-config.js');
                    const q = query(collection(db, 'admins'), where('email', '==', user.email));
                    const querySnapshot = await getDocs(q);
                    if (!querySnapshot.empty) {
                        window.location.href = 'dashboard.html';
                    }
                } catch (error) {
                    console.error('Error:', error);
                }
            }
        });

        // Handle Login
        document.getElementById('adminLoginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('adminEmail').value.trim();
            const password = document.getElementById('adminPassword').value;
            const errorDiv = document.getElementById('loginError');
            
            errorDiv.style.display = 'none';
            
            if (!email || !password) {
                errorDiv.textContent = '⚠️ Please fill all fields';
                errorDiv.style.display = 'block';
                return;
            }
            
            try {
                // Sign in with Firebase
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;
                
                // Check if admin
                const { db, collection, query, where, getDocs } = await import('../firebase-config.js');
                const q = query(collection(db, 'admins'), where('email', '==', user.email));
                const querySnapshot = await getDocs(q);
                
                if (querySnapshot.empty) {
                    errorDiv.textContent = '❌ You are not authorized as admin';
                    errorDiv.style.display = 'block';
                    await signOut(auth);
                    return;
                }
                
                // Redirect to dashboard
                window.location.href = 'dashboard.html';
                
            } catch (error) {
                let errorMsg = '❌ Login failed. ';
                switch(error.code) {
                    case 'auth/user-not-found': errorMsg += 'Admin account not found.';
                        break;
                    case 'auth/wrong-password': errorMsg += 'Wrong password.';
                        break;
                    default: errorMsg += error.message;
                }
                errorDiv.textContent = errorMsg;
                errorDiv.style.display = 'block';
            }
        });
    </script>
</body>
</html>
