<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Pinaki Farms</title>
    <link rel="stylesheet" href="../css/admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; }
        .admin-login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a3a16, #2d5a27);
            padding: 20px;
        }
        .admin-login-box {
            background: #fff;
            padding: 40px;
            border-radius: 16px;
            width: 420px;
            max-width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .admin-login-header { text-align: center; margin-bottom: 30px; }
        .admin-login-header i { font-size: 50px; color: #2d5a27; }
        .admin-login-header h2 { color: #333; font-size: 24px; margin-top: 10px; }
        .admin-login-header p { color: #666; font-size: 14px; }
        .login-error {
            background: #fee;
            color: #e74c3c;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            text-align: center;
            display: none;
        }
        .login-success {
            background: #d4edda;
            color: #155724;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            text-align: center;
            display: none;
        }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; margin-bottom: 6px; font-weight: 500; color: #333; font-size: 14px; }
        .form-group label i { color: #2d5a27; width: 20px; }
        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 15px;
            transition: border-color 0.3s;
        }
        .form-group input:focus { outline: none; border-color: #2d5a27; }
        .admin-login-btn {
            width: 100%;
            padding: 14px;
            background: #2d5a27;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        .admin-login-btn:hover { background: #1a3a16; }
        .admin-login-btn i { margin-right: 8px; }
        .admin-login-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .back-link { text-align: center; margin-top: 15px; }
        .back-link a { color: #2d5a27; text-decoration: none; font-size: 14px; }
        .back-link a:hover { text-decoration: underline; }
        .back-link a i { margin-right: 5px; }
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #2d5a27;
            color: #fff;
            padding: 14px 30px;
            border-radius: 10px;
            z-index: 999999;
            opacity: 0;
            transition: opacity 0.3s;
            max-width: 90%;
            text-align: center;
            font-weight: 500;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .toast.show { opacity: 1; }
        .toast.error { background: #e74c3c; }
        .toast.success { background: #2d5a27; }
    </style>
</head>
<body>
    <div class="admin-login-container">
        <div class="admin-login-box">
            <div class="admin-login-header">
                <i class="fas fa-leaf"></i>
                <h2>Pinaki Farms</h2>
                <p>Admin Panel Login</p>
            </div>
            
            <div id="loginError" class="login-error"></div>
            <div id="loginSuccess" class="login-success"></div>
            
            <form id="adminLoginForm">
                <div class="form-group">
                    <label><i class="fas fa-envelope"></i> Email Address</label>
                    <input type="email" id="adminEmail" placeholder="admin@pinakifarms.com" required autocomplete="email" value="admin@pinakifarms.com" />
                </div>
                <div class="form-group">
                    <label><i class="fas fa-lock"></i> Password</label>
                    <input type="password" id="adminPassword" placeholder="Enter your password" required autocomplete="current-password" />
                </div>
                <button type="submit" class="admin-login-btn" id="loginBtn">
                    <i class="fas fa-sign-in-alt"></i> Login
                </button>
                <p class="back-link">
                    <a href="#" id="forgotPassword">Forgot password?</a>
                </p>
                <p class="back-link">
                    <a href="../index.html"><i class="fas fa-arrow-left"></i> Back to Website</a>
                </p>
            </form>
        </div>
    </div>

    <script type="module">
        import { 
            auth, 
            signInWithEmailAndPassword, 
            onAuthStateChanged,
            signOut,
            sendPasswordResetEmail,
            db,
            collection,
            query,
            where,
            getDocs,
            addDoc
        } from '../firebase-config.js';

        console.log('✅ Admin Login loaded');

        const ADMIN_EMAIL = 'admin@pinakifarms.com';
        const form = document.getElementById('adminLoginForm');
        const emailInput = document.getElementById('adminEmail');
        const passwordInput = document.getElementById('adminPassword');
        const errorDiv = document.getElementById('loginError');
        const successDiv = document.getElementById('loginSuccess');
        const loginBtn = document.getElementById('loginBtn');

        // ============ CHECK ALREADY LOGGED IN ============
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                console.log('👤 User found:', user.email);
                
                if (user.email === ADMIN_EMAIL) {
                    try {
                        const q = query(collection(db, 'admins'), where('email', '==', user.email));
                        const snapshot = await getDocs(q);
                        
                        if (snapshot.empty) {
                            await addDoc(collection(db, 'admins'), {
                                email: user.email,
                                name: 'Admin',
                                role: 'admin',
                                createdAt: new Date().toISOString()
                            });
                            console.log('✅ Admin document created');
                        }
                        
                        console.log('✅ Admin verified, redirecting...');
                        window.location.href = 'dashboard.html';
                        return;
                    } catch (error) {
                        console.error('Error:', error);
                    }
                } else {
                    console.log('❌ Not admin email');
                    await signOut(auth);
                    window.location.reload();
                }
            }
        });

        // ============ SHOW TOAST ============
        function showToast(message, type = 'success') {
            const existing = document.querySelector('.toast');
            if (existing) existing.remove();
            
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            document.body.appendChild(toast);
            
            setTimeout(() => toast.classList.add('show'), 10);
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // ============ HANDLE LOGIN ============
        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = emailInput.value.trim();
            const password = passwordInput.value;
            
            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';
            
            if (!email || !password) {
                errorDiv.textContent = '⚠️ Please fill all fields';
                errorDiv.style.display = 'block';
                return;
            }
            
            if (email !== ADMIN_EMAIL) {
                errorDiv.textContent = '❌ Invalid admin email';
                errorDiv.style.display = 'block';
                return;
            }
            
            loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Logging in...';
            loginBtn.disabled = true;
            
            try {
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                console.log('✅ Login success:', userCredential.user.email);
                
                // Create admin doc if not exists
                const q = query(collection(db, 'admins'), where('email', '==', email));
                const snapshot = await getDocs(q);
                
                if (snapshot.empty) {
                    await addDoc(collection(db, 'admins'), {
                        email: email,
                        name: 'Admin',
                        role: 'admin',
                        createdAt: new Date().toISOString()
                    });
                    console.log('✅ Admin doc created');
                }
                
                successDiv.textContent = '✅ Welcome Admin! Redirecting...';
                successDiv.style.display = 'block';
                showToast('✅ Welcome Admin!');
                
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 1000);
                
            } catch (error) {
                console.error('Login error:', error);
                let msg = '❌ Login failed. ';
                if (error.code === 'auth/user-not-found') msg += 'Account not found.';
                else if (error.code === 'auth/wrong-password') msg += 'Wrong password.';
                else msg += error.message;
                
                errorDiv.textContent = msg;
                errorDiv.style.display = 'block';
                loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Login';
                loginBtn.disabled = false;
            }
        });

        document.getElementById('forgotPassword').addEventListener('click', async function(event) {
            event.preventDefault();
            const email = emailInput.value.trim();
            if (email !== ADMIN_EMAIL) {
                errorDiv.textContent = '❌ Enter the registered admin email first.';
                errorDiv.style.display = 'block';
                return;
            }
            try {
                await sendPasswordResetEmail(auth, email);
                successDiv.textContent = '✅ Password-reset link sent. Please check the admin email inbox.';
                successDiv.style.display = 'block';
            } catch (error) {
                errorDiv.textContent = '❌ Unable to send reset link. Please try again.';
                errorDiv.style.display = 'block';
            }
        });

        console.log('Admin login ready.');
    </script>
</body>
</html>
