<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Orders - Admin Panel</title>
    <link rel="stylesheet" href="../css/admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="admin-header">
        <div class="admin-header-content">
            <div class="admin-logo">
                <i class="fas fa-leaf"></i>
                <span>Pinaki Farms Admin</span>
            </div>
            <div class="admin-header-right">
                <span id="adminName">Admin</span>
                <button onclick="logoutAdmin()" class="admin-logout-btn">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </button>
            </div>
        </div>
    </header>

    <div class="admin-body">
        <div class="admin-container">
            <aside class="admin-sidebar">
                <nav class="admin-nav">
                    <a href="dashboard.html"><i class="fas fa-home"></i> Dashboard</a>
                    <a href="products.html"><i class="fas fa-box"></i> Products</a>
                    <a href="orders.html" class="active"><i class="fas fa-shopping-cart"></i> Orders</a>
                    <a href="customers.html"><i class="fas fa-users"></i> Customers</a>
                    <a href="coupons.html"><i class="fas fa-tags"></i> Coupons & Offers</a>
                    <a href="reviews.html"><i class="fas fa-star"></i> Reviews</a>
                    <a href="../index.html"><i class="fas fa-store"></i> View Website</a>
                </nav>
            </aside>

            <main class="admin-main">
                <div class="admin-section-header">
                    <h2><i class="fas fa-shopping-cart"></i> Manage Orders</h2>
                    <div class="order-filters">
                        <select id="orderFilter" onchange="filterOrders()">
                            <option value="all">All Orders</option>
                            <option value="pending">Pending</option>
                            <option value="processing">Processing</option>
                            <option value="shipped">Shipped</option>
                            <option value="delivered">Delivered</option>
                            <option value="cancelled">Cancelled</option>
                        </select>
                    </div>
                </div>

                <div class="admin-table-wrapper">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>Order ID</th>
                                <th>Customer</th>
                                <th>Items</th>
                                <th>Total</th>
                                <th>Payment</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="orderList">
                            <tr><td colspan="7" style="text-align:center;padding:40px;">Loading orders...</td></tr>
                        </tbody>
                    </table>
                </div>
            </main>
        </div>
    </div>

    <script type="module" src="../js/admin-script.js"></script>
</body>
</html>
