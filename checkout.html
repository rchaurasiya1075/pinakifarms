<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | PINAKI Farms</title>
    
    <!-- Google Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --brand-primary: #8C2D19;
            --brand-secondary: #D4A373;
            --bg-main: #FEFAE0;
            --white: #FFFFFF;
            --text-dark: #2B2D42;
            --border-color: #E2E8F0;
            --radius-md: 10px;
            --shadow-md: 0 4px 15px rgba(0,0,0,0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-dark);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px 15px;
        }

        .checkout-card {
            background: var(--white);
            width: 100%;
            max-width: 480px;
            padding: 28px 24px;
            border-radius: 16px;
            box-shadow: var(--shadow-md);
        }

        .checkout-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .checkout-header h2 {
            color: var(--brand-primary);
            font-size: 22px;
            font-weight: 700;
        }

        .checkout-header p {
            font-size: 13px;
            color: #6C757D;
            margin-top: 4px;
        }

        .form-group {
            margin-bottom: 18px;
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-dark);
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i {
            position: absolute;
            left: 14px;
            color: var(--brand-secondary);
            font-size: 15px;
        }

        .input-wrapper input {
            width: 100%;
            padding: 12px 14px 12px 42px;
            font-size: 14px;
            border: 1.5px solid var(--border-color);
            border-radius: var(--radius-md);
            outline: none;
            transition: all 0.2s ease;
        }

        .input-wrapper input:focus {
            border-color: var(--brand-primary);
            box-shadow: 0 0 0 3px rgba(140, 45, 25, 0.1);
        }

        .btn-submit {
            width: 100%;
            background-color: var(--brand-primary);
            color: var(--white);
            border: none;
            padding: 14px;
            border-radius: var(--radius-md);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.3s ease;
        }

        .btn-submit:hover {
            background-color: #702313;
        }
    </style>
</head>
<body>

    <div class="checkout-card">
        <div class="checkout-header">
            <h2>Delivery Details</h2>
            <p>Order receive karne ke liye sahi pata bharein</p>
        </div>

        <form id="checkoutForm">
            <div class="form-group">
                <label for="custName">Full Name</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" id="custName" required placeholder="Apna pura naam likhein">
                </div>
            </div>

            <div class="form-group">
                <label for="custPhone">Phone Number</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-phone"></i>
                    <input type="tel" id="custPhone" required placeholder="Mobile Number">
                </div>
            </div>

            <div class="form-group">
                <label for="custAddress">Delivery Address</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-location-dot"></i>
                    <input type="text" id="custAddress" required placeholder="Ghar ka pata, House No., Gali">
                </div>
            </div>

            <div class="form-group">
                <label for="custPincode">Pincode</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-map-pin"></i>
                    <input type="text" id="custPincode" required placeholder="6-digit Pincode">
                </div>
            </div>

            <button type="submit" class="btn-submit">Place Order</button>
        </form>
    </div>

    <script>
        document.getElementById('checkoutForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const name = document.getElementById('custName').value.trim();
            const phone = document.getElementById('custPhone').value.trim();
            const address = document.getElementById('custAddress').value.trim();
            const pincode = document.getElementById('custPincode').value.trim();

            if (!name || !phone || !address || !pincode) {
                alert('Kripya sabhi details sahi se bharein!');
                return;
            }

            alert('Order Details Saved Successfully!');
        });
    </script>
</body>
</html>
