<!-- CHECKOUT FORM HTML -->
<form id="checkoutForm">
    <div class="input-group">
        <label>Full Name</label>
        <input type="text" id="custName" required placeholder="Apna pura naam likhein">
    </div>

    <div class="input-group">
        <label>Phone Number</label>
        <input type="tel" id="custPhone" required placeholder="Mobile Number">
    </div>

    <div class="input-group">
        <label>Delivery Address</label>
        <input type="text" id="custAddress" required placeholder="Ghar ka pata, House No., Gali">
    </div>

    <div class="input-group">
        <label>Pincode</label>
        <input type="text" id="custPincode" required placeholder="6-digit Pincode">
    </div>

    <button type="submit" class="btn-primary" style="width: 100%; margin-top: 15px;">Place Order</button>
</form>

<!-- SAFE JAVASCRIPT LOGIC -->
<script>
document.getElementById('checkoutForm').addEventListener('submit', async function(e) {
    e.preventDefault();

    // Step 1: Input Elements Ko Fetch Karein (Inki IDs HTML se exact match honi chahiye)
    const nameEl = document.getElementById('custName');
    const phoneEl = document.getElementById('custPhone');
    const addressEl = document.getElementById('custAddress');
    const pincodeEl = document.getElementById('custPincode');

    // Step 2: Safe Value Extraction & Trimming
    const name = nameEl && nameEl.value ? nameEl.value.trim() : '';
    const phone = phoneEl && phoneEl.value ? phoneEl.value.trim() : '';
    const address = addressEl && addressEl.value ? addressEl.value.trim() : '';
    const pincode = pincodeEl && pincodeEl.value ? pincodeEl.value.trim() : '';

    // Step 3: Validation Check
    if (!name || !phone || !address || !pincode) {
        alert('Kripya sabhi details sahi se bharein!');
        return;
    }

    // Step 4: Order Data Object
    const orderData = {
        customerName: name,
        phone: phone,
        address: address,
        pincode: pincode,
        createdAt: new Date().toISOString()
    };

    console.log("Order Successful:", orderData);
    alert("Aapka order successfully register ho gaya hai!");
});
</script>
