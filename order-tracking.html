<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Track order | Pinaki Farms</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><style>body{margin:0;background:#f6f8f4;color:#263238;font:14px Arial}header{background:#fff;padding:16px;border-bottom:1px solid #e5e7eb}.brand{max-width:900px;margin:auto;display:block;text-decoration:none;color:#2d5a27;font-size:20px;font-weight:bold}.box{max-width:900px;margin:25px auto;background:#fff;border:1px solid #e5e7eb;border-radius:13px;padding:24px}.search{display:flex;gap:9px}.search input{flex:1;padding:12px;border:1px solid #ccd3cc;border-radius:8px}.button{background:#2d5a27;color:#fff;border:0;border-radius:8px;padding:12px 18px;font-weight:bold;cursor:pointer}.card{border:1px solid #e5e7eb;border-radius:10px;padding:16px;margin-top:16px}.timeline{margin:20px 0 0;padding:0;list-style:none}.timeline li{position:relative;padding:0 0 24px 34px;border-left:2px solid #d5e3d2;margin-left:9px}.timeline li:before{content:'✓';position:absolute;left:-11px;top:0;width:20px;height:20px;background:#2d5a27;color:#fff;border-radius:50%;text-align:center;line-height:20px}.timeline li:last-child{border:0}.muted{color:#68746d;font-size:12px;line-height:1.55}.bad{display:inline-block;border-radius:15px;padding:5px 10px;background:#e9f4e7;color:#2d5a27;font-weight:bold;text-transform:capitalize}.actions{display:flex;gap:9px;flex-wrap:wrap}.outline{background:#fff;border:1px solid #2d5a27;color:#2d5a27}@media(max-width:600px){.box{margin:14px;padding:16px}.search{flex-direction:column}}</style></head><body><header><a class="brand" href="index.html"><i class="fa-solid fa-leaf"></i> Pinaki Farms</a></header><main class="box"><h1 style="margin-top:0;color:#2d5a27">Track your order</h1><p class="muted">Enter your full order ID, or open an order from your account.</p><div class="search"><input id="id" placeholder="Order ID"><button class="button" id="go">Track order</button></div><div id="result"></div></main><script type="module">import{db,auth,doc,getDoc,onAuthStateChanged,updateDoc}from'./firebase-config.js';let user;const q=new URLSearchParams(location.search),out=document.getElementById('result'),esc=v=>{const e=document.createElement('i');e.textContent=v||'';return e.innerHTML},fmt=v=>v?new Date(v).toLocaleString('en-IN',{dateStyle:'medium',timeStyle:'short'}):'';onAuthStateChanged(auth,u=>user=u);async function load(){const id=document.getElementById('id').value.trim();if(!id){alert('Enter your full order ID.');return}out.innerHTML='<p class="muted">Loading order…</p>';try{const s=await getDoc(doc(db,'orders',id));if(!s.exists()||(user&&s.data().userId!==user.uid)){out.innerHTML='<p>Order not found. Please sign in to the account used for this order.</p>';return}const o={id:s.id,...s.data()},t=o.tracking||{},events=t.events||[{title:'Order confirmed',description:'We received your order.',at:o.createdAt}];out.innerHTML='<section class="card"><div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap"><div><b>Order #'+esc(o.id.slice(0,8).toUpperCase())+'</b><div class="muted">Placed '+fmt(o.createdAt)+'</div></div><span class="bad">'+esc(o.status||'confirmed')+'</span></div><hr style="border:0;border-top:1px solid #e5e7eb;margin:16px 0"><p><b>Courier:</b> '+esc(t.courierName||'Awaiting courier assignment')+'</p><p><b>Tracking number:</b> '+esc(t.trackingNumber||'Will be shared after dispatch')+'</p><p><b>Payment:</b> '+esc(o.paymentMethod||'')+' · '+esc((o.paymentStatus||'').replace(/_/g,' '))+'</p><p><b>Delivery address:</b> '+esc(o.addressText||'')+'</p><h3>Order timeline</h3><ol class="timeline">'+events.map(x=>'<li><b>'+esc(x.title||x.status)+'</b><div>'+esc(x.description||'')+'</div><small class="muted">'+fmt(x.at)+'</small></li>').join('')+'</ol><div class="actions">'+((o.cancellationAllowed!==false&&['confirmed','pending','processing'].includes(o.status||'confirmed'))?'<button class="button outline" id="cancel">Cancel order</button>':'')+((o.status==='delivered'&&o.returnRequested!==true)?'<button class="button outline" id="return">Request return</button>':'')+'</div></section>';const cancel=document.getElementById('cancel');if(cancel)cancel.onclick=()=>change('cancelled','Order cancelled','Your cancellation request has been accepted.');const ret=document.getElementById('return');if(ret)ret.onclick=()=>change('delivered','Return requested','We received your return request and will contact you shortly.')}catch(e){console.error(e);out.innerHTML='<p>Could not load this order. Please try again.</p>'}}async function change(status,title,description){if(!confirm(title+'?'))return;const id=document.getElementById('id').value.trim(),s=await getDoc(doc(db,'orders',id)),o=s.data(),t=o.tracking||{},events=t.events||[];events.unshift({status,title,description,at:new Date().toISOString()});const data={updatedAt:new Date().toISOString(),tracking:{...t,events}};if(status==='cancelled'){data.status='cancelled';data.cancellationAllowed=false}else data.returnRequested=true;await updateDoc(doc(db,'orders',id),data);load()}document.getElementById('go').onclick=load;document.getElementById('id').addEventListener('keydown',e=>{if(e.key==='Enter')load()});if(q.get('order')){document.getElementById('id').value=q.get('order');setTimeout(load,300)}</script></body></html>
