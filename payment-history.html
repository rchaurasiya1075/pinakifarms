<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment History - Pinaki Farms</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="dashboard-styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Top Header -->
    <div class="dashboard-header">
        <div class="container">
            <div class="header-left">
                <a href="index.html" class="logo">
                    <i class="fas fa-leaf"></i>
                    <span>Pinaki Farms</span>
                </a>
                <span class="dashboard-title">| Payment History</span>
            </div>
            <div class="header-right">
                <span class="user-welcome" id="userWelcome">Welcome, User!</span>
                <button onclick="logoutUser()" class="logout-btn">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </button>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="dashboard-container">
        <div class="container">
            <div class="dashboard-grid">
                <!-- Sidebar -->
                <aside class="dashboard-sidebar">
                    <div class="user-profile-card">
                        <div class="user-avatar">
                            <i class="fas fa-user-circle"></i>
                        </div>
                        <h3 id="userName">User Name</h3>
                        <p id="userEmail">user@email.com</p>
                        <span class="user-role">Customer</span>
                    </div>
                    
                    <nav class="dashboard-nav">
                        <a href="dashboard.html">
                            <i class="fas fa-home"></i> Dashboard
                        </a>
                        <a href="order-history.html">
                            <i class="fas fa-shopping-bag"></i> Order History
                        </a>
                        <a href="payment-history.html" class="active">
                            <i class="fas fa-credit-card"></i> Payment History
                        </a>
                        <a href="profile.html">
                            <i class="fas fa-user-cog"></i> Profile Settings
                        </a>
                        <a href="index.html">
                            <i class="fas fa-store"></i> Continue Shopping
                        </a>
                    </nav>
                </aside>

                <!-- Main Content -->
                <main class="dashboard-main">
                    <div class="page-header">
                        <h2><i class="fas fa-credit-card"></i> Payment History</h2>
                        <div class="payment-summary">
                            <div class="summary-item">
                                <span>Total Paid:</span>
                                <strong id="totalPaid">₹0</strong>
                            </div>
                            <div class="summary-item">
                                <span>Total Orders:</span>
                                <strong id="totalPaymentOrders">0</strong>
                            </div>
                        </div>
                    </div>

                    <div class="orders-table-wrapper">
                        <table class="orders-table full-width">
                            <thead>
                                <tr>
                                    <th>Payment ID</th>
                                    <th>Order ID</th>
                                    <th>Date</th>
                                    <th>Amount</th>
                                    <th>Method</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody id="allPaymentsBody">
                                <tr>
                                    <td colspan="6" style="text-align:center;padding:60px;">
                                        <i class="fas fa-spinner fa-spin"></i> Loading payments...
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </main>
            </div>
        </div>
    </div>

    <script type="module" src="dashboard-script.js"></script>
</body>
</html>
